repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        # Generated API dumps end with a trailing blank line that `apiCheck`
        # requires; the fixer would strip it and break the check.
        exclude: '\.api$'
  # These need no build, so they run here rather than in the Gradle workflow.
  - repo: local
    hooks:
      - id: check-testdata
        name: check-testdata
        entry: scripts/check-testdata.sh
        language: script
        always_run: true
        pass_filenames: false
      - id: script-tests
        name: script-tests
        entry: scripts/tests/run.sh
        language: script
        always_run: true
        pass_filenames: false
