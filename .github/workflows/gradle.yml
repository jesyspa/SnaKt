# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Formal Verification Plugin CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The oldest JDK the build supports and the newest. The compile
        # toolchain is pinned, so what varies here is the JDK the Gradle daemon
        # and the checks that run inside it see.
        java-version: [ '21', '25' ]

    steps:
      - uses: actions/checkout@v3
      - name: Setup Z3
        id: z3
        uses: cda-tum/setup-z3@v1
        with:
          version: 4.8.7

      - name: Setup Z3_EXE
        run: echo "Z3_EXE=${{ steps.z3.outputs.z3-root }}/bin/z3" >> $GITHUB_ENV

      - name: Check z3 version
        run: $Z3_EXE --version

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Run detekt
        run: ./gradlew detekt
      - name: Check public API compatibility
        run: ./gradlew apiCheck
      - name: Run locality tests
        run: ./gradlew :formver.compiler-plugin:locality:test
      - name: Run all tests (conversion + verification)
        run: ./gradlew :formver.compiler-plugin:test
      - name: Report failing test results
        uses: mikepenz/action-junit-report@v4
        if: failure()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
